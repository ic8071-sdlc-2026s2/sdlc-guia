<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SDLC Lab IC-8071</title>
<style>
/* Layout: consola de una columna (máx. 1120 px). Arriba, la ruta de misiones por sesión;
   abajo, la misión activa: pasos guiados a la izquierda y la verificación del repositorio fija a la derecha. */
:root{
  --azul:#0F6CBD; --azul-2:#115EA3; --azul-suave:#EFF6FC; --azul-borde:#B4D6FA; --sobre-azul:#FFFFFF;
  --txt:#242424; --txt-2:#5C5C5C; --txt-3:#707070;
  --bg:#FFFFFF; --bg-2:#FAF9F8; --bg-3:#F3F2F1; --bd:#E1DFDD; --bd-2:#C8C6C4;
  --nav:#1F1F1F; --nav-txt:#F3F2F1; --nav-txt-2:#BDBDBD; --nav-bd:#4A4A4A;
  --ok:#0E700E; --ok-bg:#F1FAF1; --ok-bd:#9FD89F; --err:#A4262C; --err-bg:#FDF3F4; --aviso:#8A3707; --aviso-bg:#FFF4CE;
  --s:#C4314B; --t:#CA5010; --r:#8764B8; --i:#0F6CBD; --d:#986F0B; --e:#107C10; --otra:#69797E;
  --calor-1:#DFF6DD; --calor-2:#FFF4CE; --calor-3:#FDE7E9;
  --codigo-bg:#F7F7F7;
  --f-ui:'Segoe UI','Segoe UI Web',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --f-mono:'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --azul:#479EF5; --azul-2:#62ABF5; --azul-suave:#0C2B4A; --azul-borde:#1F4E80; --sobre-azul:#0A0A0A;
    --txt:#F3F2F1; --txt-2:#C8C6C4; --txt-3:#ADABA9;
    --bg:#1B1A19; --bg-2:#222120; --bg-3:#2C2B2A; --bd:#3B3A39; --bd-2:#4A4846;
    --nav:#111110; --nav-txt:#F3F2F1; --nav-txt-2:#A19F9D; --nav-bd:#3B3A39;
    --ok:#6CCB5F; --ok-bg:#132A13; --ok-bd:#2E5E2B; --err:#F1707B; --err-bg:#3A161A; --aviso:#FCE100; --aviso-bg:#3A3208;
    --s:#EE6B7F; --t:#F08A4B; --r:#B59BE0; --i:#62ABF5; --d:#E0B53A; --e:#6CCB5F; --otra:#A0AEB2;
    --calor-1:#173A17; --calor-2:#3A3208; --calor-3:#3A161A;
    --codigo-bg:#252423;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --azul:#479EF5; --azul-2:#62ABF5; --azul-suave:#0C2B4A; --azul-borde:#1F4E80; --sobre-azul:#0A0A0A;
  --txt:#F3F2F1; --txt-2:#C8C6C4; --txt-3:#ADABA9;
  --bg:#1B1A19; --bg-2:#222120; --bg-3:#2C2B2A; --bd:#3B3A39; --bd-2:#4A4846;
  --nav:#111110; --nav-txt:#F3F2F1; --nav-txt-2:#A19F9D; --nav-bd:#3B3A39;
  --ok:#6CCB5F; --ok-bg:#132A13; --ok-bd:#2E5E2B; --err:#F1707B; --err-bg:#3A161A; --aviso:#FCE100; --aviso-bg:#3A3208;
  --s:#EE6B7F; --t:#F08A4B; --r:#B59BE0; --i:#62ABF5; --d:#E0B53A; --e:#6CCB5F; --otra:#A0AEB2;
  --calor-1:#173A17; --calor-2:#3A3208; --calor-3:#3A161A;
  --codigo-bg:#252423;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--txt);font:14px/1.5 var(--f-ui)}
a{color:var(--azul)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:24px;font-weight:600}
h2{font-size:15px;font-weight:600}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],select{background:var(--bg);color:var(--txt);border:1px solid var(--bd-2);border-radius:4px;padding:6px 9px;min-width:0;width:100%}
input::placeholder{color:var(--txt-3)}
.ceja{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-2);font-weight:600}
.p-inst{color:var(--txt-2);font-size:13px;max-width:72ch}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
.banda{background:var(--nav);color:var(--nav-txt)}
.banda-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.marca{font-weight:600}
.marca span{color:var(--nav-txt-2);font-weight:400}
.b-equipo{border:1px solid var(--nav-bd);border-radius:3px;padding:1px 8px;font-size:12px}
.b-xp{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--nav-txt-2)}
.b-xp b{color:#FFB900;font-size:14px}
.b-bt{background:transparent;border:1px solid var(--nav-bd);color:var(--nav-txt);border-radius:3px;padding:3px 10px;font-size:12px;cursor:pointer;text-decoration:none}
.b-bt:hover{background:#2B2B2B}
.pagina{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:flex;flex-direction:column;gap:20px}

.bt{font-weight:600;font-size:13px;border-radius:4px;border:1px solid var(--azul);background:var(--azul);color:var(--sobre-azul);padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.bt:hover{background:var(--azul-2);border-color:var(--azul-2)}
.bt.sec{background:var(--bg);color:var(--azul)}
.bt.sec:hover{background:var(--azul-suave)}
.bt.peq{font-size:12px;padding:4px 10px}
.bt[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd-2);background:var(--bg);color:var(--txt);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--azul)}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul);font-weight:600}
.github{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--txt);background:var(--bg-3);border:1px solid var(--bd-2);border-radius:3px;padding:1px 6px}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fila > input{flex:1 1 260px}
.aviso{border-radius:6px;background:var(--aviso-bg);padding:10px 12px;font-size:13px}

/* Ruta */
.ruta{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.sesion{flex:1 0 auto;min-width:150px;border:1px solid var(--bd);border-radius:6px;background:var(--bg-2);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.sesion h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-2)}
.nodos{display:flex;gap:6px}
.nodo{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;background:none;border:0;padding:2px;cursor:pointer;color:var(--txt);text-align:center}
.nodo .circ{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--bd-2);background:var(--bg);font-variant-numeric:tabular-nums}
.nodo .lbl{font-size:11px;line-height:1.2;color:var(--txt-2)}
.nodo.hecha .circ{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.nodo.ahora .circ{border-color:var(--azul);color:var(--azul)}
.nodo[aria-current="true"] .circ{box-shadow:0 0 0 3px var(--azul-borde)}
.nodo[aria-current="true"] .lbl{color:var(--txt);font-weight:600}

/* Misión */
.m-cab{display:flex;gap:14px;align-items:flex-start}
.m-num{flex:none;width:44px;height:44px;border-radius:8px;background:var(--nav);color:var(--nav-txt);display:grid;place-items:center;font-size:20px;font-weight:700}
.m-meta{color:var(--txt-2);margin-top:2px;max-width:70ch}
.m-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.pasos{display:flex;flex-direction:column;gap:12px;min-width:0}
.paso{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;border:1px solid var(--bd);border-radius:6px;padding:14px 16px;background:var(--bg)}
.paso.ok{border-color:var(--ok-bd)}
.p-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--bg-3);color:var(--txt-2)}
.paso.ok .p-num{background:var(--ok);color:var(--bg)}
.p-cuerpo{display:flex;flex-direction:column;gap:10px;min-width:0}
.p-cuerpo > .bt,.p-cuerpo > .chip,.p-cuerpo > a.bt{align-self:flex-start}
.p-tit{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.p-falta{font-size:12.5px;color:var(--aviso);font-weight:600}
.paso.ok .p-falta{color:var(--ok)}
.check{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);border:1px solid var(--bd);border-radius:6px;background:var(--bg-2);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.anillo{display:flex;align-items:center;gap:12px}
.anillo svg{flex:none}
.anillo .pct{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.criterios{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.criterios li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;align-items:baseline}
.criterios .ic{font-weight:700;color:var(--txt-3)}
.criterios li.ok .ic{color:var(--ok)}
.criterios li:not(.ok){color:var(--txt-2)}
.criterios small{display:block;color:var(--txt-3);font-size:11.5px}
.criterios .grupo{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-2);font-weight:700;margin-top:4px}
.premio{border-radius:6px;background:var(--ok-bg);border:1px solid var(--ok-bd);padding:12px;display:flex;flex-direction:column;gap:6px}
.premio b{color:var(--ok)}
.sello{font-size:11.5px;color:var(--txt-3)}
details.problemas{border:1px solid var(--bd);border-radius:6px;background:var(--bg-2);padding:10px 14px}
details.problemas summary{cursor:pointer;font-weight:600}
details.problemas ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
details.problemas b{font-weight:600}

/* Piezas */
.mini-pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.mini{border:1px solid var(--bd);border-radius:6px;padding:10px 12px;background:var(--bg-2);display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.mini .mi-n{font-size:11px;font-weight:700;color:var(--txt-2);letter-spacing:.06em;text-transform:uppercase}
.mini > .bt,.mini > a.bt{align-self:flex-start}
.ruta-gh{font-family:var(--f-mono);font-size:12px;background:var(--codigo-bg);border-radius:3px;padding:1px 5px;overflow-wrap:anywhere}
.cmd{display:flex;align-items:center;gap:6px;background:var(--codigo-bg);border:1px solid var(--bd);border-radius:4px;padding:4px 4px 4px 10px;min-width:0}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:pre;font-size:12px}
.cmd button{flex:none;border:1px solid var(--bd-2);background:var(--bg);border-radius:3px;font-size:11px;padding:2px 8px;cursor:pointer;color:var(--txt-2)}
.resultado{font-size:13px;border-radius:4px;padding:8px 10px;background:var(--bg-3)}
.resultado.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.resultado.mal{background:var(--aviso-bg);color:var(--txt)}
.seg{display:inline-flex;border:1px solid var(--bd-2);border-radius:4px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--bd-2);background:var(--bg);padding:6px 14px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--azul);color:var(--sobre-azul)}
.personas{display:flex;flex-direction:column;gap:6px}
.personas > .bt{align-self:flex-start}
.persona{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;align-items:center}
.persona .n{font-size:12px;color:var(--txt-2);font-variant-numeric:tabular-nums;text-align:center}
.quitar{border:1px solid var(--bd-2);background:var(--bg);border-radius:4px;height:32px;cursor:pointer;color:var(--txt-2)}
.quitar:hover{color:var(--err);border-color:var(--err)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.app{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--bd);border-radius:6px;background:var(--bg);padding:12px;cursor:pointer}
.app[aria-pressed="true"]{border-color:var(--azul);box-shadow:inset 0 0 0 1px var(--azul);background:var(--azul-suave)}
.a-cab{display:flex;align-items:center;gap:10px}
.a-logo{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--nav);color:var(--nav-txt);flex:none}
.a-tipo{font-size:12px;color:var(--txt-2)}
.a-stack{display:flex;flex-wrap:wrap;gap:4px}
.a-stack span{font-size:11px;border:1px solid var(--bd);border-radius:3px;padding:0 5px;color:var(--txt-2)}
.tabla-env{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--txt-2);font-weight:600;background:var(--bg-3)}
.roles{min-width:560px}
.roles td:first-child{white-space:nowrap;font-weight:600;font-size:12.5px}
.roles select{min-width:110px}
.roles select.mal{border-color:var(--err);color:var(--err)}
.pred{display:grid;grid-template-columns:22px minmax(0,1.2fr) minmax(0,2fr);gap:8px;align-items:center}
.pred .n{font-weight:700;color:var(--txt-2);text-align:center}
.vacio{border:1px dashed var(--bd-2);border-radius:6px;padding:16px;text-align:center;color:var(--txt-2);font-size:13px}

.stride{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.st{border:1px solid var(--bd);border-radius:6px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--txt-3)}
.st .L{font-size:26px;font-weight:700;line-height:1}
.st .nom{font-size:12px;font-weight:600;color:var(--txt-2)}
.st .des{font-size:11px;color:var(--txt-2);line-height:1.3}
.st.on{border-color:currentColor}
.st.on .nom,.st.on .des{color:var(--txt)}
.st.on[data-k="S"]{color:var(--s)} .st.on[data-k="T"]{color:var(--t)} .st.on[data-k="R"]{color:var(--r)}
.st.on[data-k="I"]{color:var(--i)} .st.on[data-k="D"]{color:var(--d)} .st.on[data-k="E"]{color:var(--e)}
.form-caso{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.ancho{grid-column:1/-1}
.campo label,.campo .lab{font-size:12px;font-weight:600;color:var(--txt-2)}
.campo .ok{color:var(--ok)}
.gherkin{display:flex;flex-direction:column;gap:6px}
.g{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center}
.g span{font-family:var(--f-mono);font-size:12px;font-weight:700;border-radius:3px;padding:6px 0;text-align:center}
.g.dado span{background:var(--azul-suave);color:var(--azul)}
.g.cuando span{background:var(--aviso-bg);color:var(--aviso)}
.g.entonces span{background:var(--err-bg);color:var(--err)}
.cat-chip[aria-pressed="true"]{color:var(--bg)}
.cat-chip[data-k="S"][aria-pressed="true"]{background:var(--s);border-color:var(--s)}
.cat-chip[data-k="T"][aria-pressed="true"]{background:var(--t);border-color:var(--t)}
.cat-chip[data-k="R"][aria-pressed="true"]{background:var(--r);border-color:var(--r)}
.cat-chip[data-k="I"][aria-pressed="true"]{background:var(--i);border-color:var(--i)}
.cat-chip[data-k="D"][aria-pressed="true"]{background:var(--d);border-color:var(--d)}
.cat-chip[data-k="E"][aria-pressed="true"]{background:var(--e);border-color:var(--e)}
.cat-chip[data-k="X"][aria-pressed="true"],.cat-chip[data-k="Y"][aria-pressed="true"]{background:var(--otra);border-color:var(--otra)}
.ejemplo{border:1px dashed var(--bd-2);border-radius:6px;padding:10px 12px;background:var(--bg-2);font-size:13px;display:flex;flex-direction:column;gap:6px}
.casos{display:flex;flex-direction:column;gap:8px}
.caso{border:1px solid var(--bd);border-left:4px solid var(--otra);border-radius:5px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.caso[data-k="S"]{border-left-color:var(--s)} .caso[data-k="T"]{border-left-color:var(--t)} .caso[data-k="R"]{border-left-color:var(--r)}
.caso[data-k="I"]{border-left-color:var(--i)} .caso[data-k="D"]{border-left-color:var(--d)} .caso[data-k="E"]{border-left-color:var(--e)}
.c-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.c-cab b{font-size:14px}
.c-cat{font-size:11px;font-weight:700;border-radius:3px;padding:0 6px;background:var(--bg-3)}
.c-comp{font-family:var(--f-mono);font-size:12px;color:var(--txt-2);overflow-wrap:anywhere}
.c-g{font-size:12.5px;color:var(--txt-2);display:flex;flex-direction:column;gap:1px}
.c-g b{font-family:var(--f-mono);font-size:11.5px;color:var(--txt)}
.c-acc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.enviado{font-size:12px;color:var(--ok);font-weight:600}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.matriz{min-width:760px}
.matriz td input,.matriz td select{padding:4px 6px}
.matriz td.r{font-weight:700;text-align:center;font-variant-numeric:tabular-nums;border-radius:3px}
.matriz td.c1{background:var(--calor-1)} .matriz td.c2{background:var(--calor-2)} .matriz td.c3{background:var(--calor-3)}
.calor{display:grid;grid-template-columns:auto repeat(3,64px);grid-template-rows:repeat(3,52px) auto;gap:4px;align-items:center}
.calor .c{border-radius:4px;display:flex;flex-wrap:wrap;gap:2px;align-content:center;justify-content:center;padding:3px;font-size:11px;font-weight:700;font-family:var(--f-mono)}
.calor .c1{background:var(--calor-1)} .calor .c2{background:var(--calor-2)} .calor .c3{background:var(--calor-3)}
.calor .eje{font-size:11px;color:var(--txt-2);text-align:center}
.reloj{font-family:var(--f-mono);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.reloj.fin{color:var(--err)}
.respaldo{border:1px solid var(--bd);border-radius:6px;padding:14px 16px;background:var(--bg-2);display:flex;flex-direction:column;gap:8px}
.respaldo textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;background:var(--bg);color:var(--txt);border:1px solid var(--bd-2);border-radius:4px;padding:8px}

@media (max-width:900px){ .m-grid{grid-template-columns:1fr} .check{position:static;order:-1} }
@media (max-width:640px){
  .stride{grid-template-columns:repeat(3,minmax(0,1fr))}
  .form-caso{grid-template-columns:1fr}
  .persona{grid-template-columns:22px minmax(0,1fr) 32px}
  .persona input.gh{grid-column:2/3}
  .pred{grid-template-columns:22px minmax(0,1fr)}
  .pred .chips{grid-column:2/3}
  .g{grid-template-columns:70px minmax(0,1fr)}
}
